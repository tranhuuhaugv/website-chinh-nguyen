name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Seed lại DB khi commit có [seed] hoặc bấm Run workflow tay.
      DO_SEED: ${{ contains(github.event.head_commit.message, '[seed]') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DO_SEED
          script: |
            set -e
            cd /var/www/website-chinh-nguyen
            git fetch origin master
            git reset --hard origin/master
            npm install
            npx prisma db push
            # Seed TRƯỚC khi build vì các trang (blog/chủ) render tĩnh lúc build.
            # Seed reset catalog + blog + settings (KHÔNG đụng tài khoản khách & đơn hàng).
            if [ "$DO_SEED" = "true" ]; then
              echo "== Seeding database =="
              npm run db:seed
            fi
            # Thêm bài blog soạn trong code (chỉ tạo bài thiếu, không ghi đè bài admin).
            npm run db:sync-posts
            # Tạo sẵn các dòng máy phổ biến (chỉ tạo dòng thiếu, không đè dòng admin).
            npm run db:sync-series
            # Điền giá gốc cho SP còn thiếu để mọi máy hiện giảm giá (không đè giá admin đặt).
            npm run db:fill-discounts
            rm -rf .next
            npm run build
            pm2 restart chinhnguyen
